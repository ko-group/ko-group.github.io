  bio: Dr. Yizhi Song is a postdoctoral researcher. Prior to joining our group. She was a postdoctoral researcher at Temple University, with a Ph.D. in condensed matter physics from Peking University. She is passionate about advancing foundational science that deepens our understanding of complex molecular systems. The full list of her publication can be found on her [Google Scholar Page](https://scholar.google.com/citations?user=663tOzAAAAAJ&hl=en).


